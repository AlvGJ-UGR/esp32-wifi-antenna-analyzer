<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect width="900" height="300" fill="#ffffff"/>

  <!-- Antena -->
  <g>
    <rect x="20" y="110" width="110" height="70" rx="8" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/>
    <text x="75" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Antena</text>
    <text x="75" y="160" text-anchor="middle" font-size="12" fill="#4a5568">bajo prueba</text>
  </g>

  <line x1="130" y1="145" x2="178" y2="145" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ESP32 -->
  <g>
    <rect x="180" y="95" width="150" height="100" rx="8" fill="#e6f0ff" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="255" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">ESP32</text>
    <text x="255" y="144" text-anchor="middle" font-size="11.5" fill="#2d3748">firmware/esp32_wifi_scanner</text>
    <text x="255" y="160" text-anchor="middle" font-size="11.5" fill="#2d3748">(PlatformIO, C++)</text>
    <text x="255" y="180" text-anchor="middle" font-size="11" fill="#718096">escanea y envía, nada más</text>
  </g>

  <line x1="330" y1="145" x2="378" y2="145" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="354" y="115" text-anchor="middle" font-size="11" fill="#4a5568">USB Serial</text>
  <text x="354" y="128" text-anchor="middle" font-size="11" fill="#4a5568">115200, JSON/línea</text>

  <!-- PC software -->
  <g>
    <rect x="380" y="70" width="220" height="150" rx="8" fill="#eafaf1" stroke="#2f855a" stroke-width="1.5"/>
    <text x="490" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Programa de PC</text>
    <text x="490" y="116" text-anchor="middle" font-size="11.5" fill="#2d3748">software/wifi_antenna_analyzer</text>
    <text x="490" y="132" text-anchor="middle" font-size="11.5" fill="#2d3748">(paquete Python)</text>

    <text x="490" y="155" text-anchor="middle" font-size="11" fill="#276749">Scanner · Benchmark</text>
    <text x="490" y="171" text-anchor="middle" font-size="11" fill="#276749">Comparador · Gráficas</text>
    <text x="490" y="187" text-anchor="middle" font-size="11" fill="#276749">Estadísticas</text>
    <text x="490" y="207" text-anchor="middle" font-size="10.5" fill="#718096">waa-scan (CLI) · waa-gui (Tkinter)</text>
  </g>

  <line x1="600" y1="145" x2="648" y2="145" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outputs -->
  <g>
    <rect x="650" y="30" width="230" height="60" rx="8" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/>
    <text x="765" y="55" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">data/*.csv</text>
    <text x="765" y="73" text-anchor="middle" font-size="11" fill="#744210">escaneo · benchmark · comparación</text>
  </g>
  <g>
    <rect x="650" y="105" width="230" height="55" rx="8" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/>
    <text x="765" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">Informe PDF</text>
    <text x="765" y="146" text-anchor="middle" font-size="11" fill="#744210">tabla + gráfico de barras</text>
  </g>
  <g>
    <rect x="650" y="175" width="230" height="55" rx="8" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/>
    <text x="765" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">RSSI en vivo</text>
    <text x="765" y="216" text-anchor="middle" font-size="10" fill="#744210">tabla, gráficas y estadísticas</text>
  </g>

  <line x1="490" y1="220" x2="490" y2="245" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- e-paper opcional -->
  <g>
    <rect x="380" y="248" width="220" height="42" rx="8" fill="#f5f0ff" stroke="#6b46c1" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="490" y="265" text-anchor="middle" font-size="11.5" font-weight="600" fill="#44337a">Alternativa opcional</text>
    <text x="490" y="281" text-anchor="middle" font-size="10.5" fill="#553c9a">firmware/esp32_epaper_display (standalone, sin PC)</text>
  </g>

  <text x="450" y="18" text-anchor="middle" font-size="12" fill="#a0aec0">El ESP32 solo escanea y envía; toda la inteligencia vive en el PC.</text>
</svg>
