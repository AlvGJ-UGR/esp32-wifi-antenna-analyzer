; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Wall
    -Wextra

; Si tu placa usa otro chip/variante (ej. ESP32-S3, ESP32-C3,
; WEMOS LOLIN32, etc.) cambia 'board' por el id correspondiente.
; Lista de boards: https://docs.platformio.org/page/boards/index.html
;
; ESP32-WROOM-32UE: usa el mismo chip (ESP32-D0WD) y pinout que el
; WROOM-32 estándar (solo cambia la antena, vía conector U.FL en vez
; de PCB), así que la definición genérica 'esp32dev' de arriba vale
; sin tocar nada. Ver notas de antena más abajo en este README.
