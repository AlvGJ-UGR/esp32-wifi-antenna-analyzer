; PlatformIO project configuration — modo standalone con pantalla e-paper.
; Proyecto PlatformIO independiente de firmware/esp32_wifi_scanner/ para
; que quien no tenga la pantalla no necesite descargar estas librerías
; (GxEPD2 + Adafruit GFX/BusIO) al compilar el firmware principal.
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Sin versión fijada a propósito: no se ha podido compilar este
; proyecto en el entorno donde se escribió (sandbox sin acceso a
; registry.platformio.org) para verificar qué versión exacta resuelve
; bien; PlatformIO instalará la última compatible con esp32+arduino.
; Si al compilar te da un error de versión, prueba a fijar
; `zinggjm/GxEPD2@^1.6` explícitamente.
lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO

build_flags =
    -Wall
    -Wextra

; ESP32-WROOM-32UE: mismo chip/pinout que el WROOM-32 estándar, la
; definición genérica 'esp32dev' vale sin tocar nada (ver
; firmware/esp32_wifi_scanner/README.md para el detalle de antena).
