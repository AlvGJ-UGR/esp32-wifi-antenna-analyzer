[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-antenna-analyzer"
version = "0.5.0"
description = "Herramienta para comparar antenas Wi-Fi de forma objetiva usando un ESP32 como sensor RSSI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlvGJ-UGR", email = "alvarogj1@correo.ugr.es" }]
keywords = ["esp32", "wifi", "rssi", "antenna", "rf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "pyserial>=3.5",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
]

[project.scripts]
waa-scan = "wifi_antenna_analyzer.cli:main"
waa-gui = "wifi_antenna_analyzer.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
